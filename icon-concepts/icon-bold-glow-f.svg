<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <radialGradient id="bg2" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#060A14"/>
    </radialGradient>

    <!-- Glow filters -->
    <filter id="g1" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="32"/>
    </filter>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>
    <filter id="g3" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <filter id="g4" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>

    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="35%" stop-color="#fff" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="sq2">
      <rect x="16" y="16" width="480" height="480" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <!-- Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#bg2)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100" fill="url(#glass2)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" ry="100"
    fill="none" stroke="#00F5C4" stroke-opacity="0.04" stroke-width="1"/>

  <g clip-path="url(#sq2)">
    <!-- Surface reflection -->
    <ellipse cx="220" cy="150" rx="170" ry="75" fill="#fff" opacity="0.008"/>

    <!-- Bold filled F shape — like the reference P icon but with F.
         Thick, confident letterform with rounded corners.
         The shape itself glows like a solid neon panel. -->

    <path id="fShape"
      d="M 155 385
         C 155 393, 160 398, 168 398
         L 193 398
         C 201 398, 206 393, 206 385
         L 206 272
         L 310 272
         C 318 272, 323 267, 323 259
         L 323 240
         C 323 232, 318 227, 310 227
         L 206 227
         L 206 160
         L 338 160
         C 346 160, 351 155, 351 147
         L 351 128
         C 351 120, 346 115, 338 115
         L 168 115
         C 160 115, 155 120, 155 128
         Z"
    />

    <!-- Layer 1: Wide ambient bloom -->
    <use href="#fShape" fill="#00F5C4" filter="url(#g1)" opacity="0.45"/>

    <!-- Layer 2: Medium glow -->
    <use href="#fShape" fill="#00F5C4" filter="url(#g2)" opacity="0.5"/>

    <!-- Layer 3: Tight glow -->
    <use href="#fShape" fill="#00F5C4" filter="url(#g3)" opacity="0.6"/>

    <!-- Layer 4: Near-surface glow -->
    <use href="#fShape" fill="#00F5C4" filter="url(#g4)" opacity="0.7"/>

    <!-- Layer 5: Core — bright cyan-white -->
    <use href="#fShape" fill="#B0FFF0" opacity="0.85"/>

    <!-- Layer 6: Hot white highlights on edges -->
    <!-- Top bar highlight -->
    <rect x="168" y="122" width="170" height="8" rx="4" fill="#fff" opacity="0.35"/>
    <!-- Stem left edge highlight -->
    <rect x="160" y="122" width="6" height="268" rx="3" fill="#fff" opacity="0.2"/>
    <!-- Middle bar highlight -->
    <rect x="210" y="234" width="100" height="6" rx="3" fill="#fff" opacity="0.25"/>
  </g>
</svg>